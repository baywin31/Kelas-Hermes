<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karyawan Digital — Member Area Kelas Hermes Agent</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#25282b; --bg-soft:#2b2f32;
  --panel:rgba(164,216,255,.035); --panel2:rgba(164,216,255,.07); --panel3:rgba(164,216,255,.10);
  --line:rgba(164,216,255,.14); --line-soft:rgba(164,216,255,.07);
  --fg:#f2f7fc; --fg2:#cfdae5; --muted:#94a3af; --muted2:#6d7883;
  --accent:#A4D8FF; --accent2:#BFE4FF; --accent3:#8CCBFA;
  --on-accent:#22262a;
  --ok:#7fd8b5; --danger:#ff9b9e; --warn:#f5c97a; --tele:#A4D8FF;
  --r-s:6px; --r-m:8px; --r-l:12px; --r-xl:16px;
  --ring:0 0 0 1px var(--accent2), 0 0 0 4px rgba(164,216,255,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--fg2);
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"cv01","ss03"; font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  background-image:radial-gradient(900px 420px at 50% -180px, rgba(164,216,255,.10), transparent 70%);
  background-repeat:no-repeat;
}
.wrap{width:100%; max-width:940px; margin:0 auto; padding:0 20px}
.wrap.lebar{max-width:1240px}
a{color:var(--accent3); text-decoration:none; transition:color .15s; cursor:pointer}
a:hover{color:#D4EDFF}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;background:var(--accent);color:#22262a;padding:10px 14px;border-radius:var(--r-m);z-index:99}
::selection{background:rgba(164,216,255,.34); color:#22262a}

/* ---------- topbar ---------- */
.topbar{position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line-soft);
  background:rgba(8,9,10,.72); backdrop-filter:saturate(160%) blur(14px)}
.bar{display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:60px; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; gap:1px; color:var(--fg)}
.brand strong{font-size:15px; font-weight:600; letter-spacing:-.24px; color:var(--fg)}
.brand .tag{color:var(--muted2); font-size:11.5px; letter-spacing:-.1px}
.nav{display:flex; gap:2px; flex-wrap:wrap; align-items:center}
.nav a{color:var(--muted); padding:8px 11px; border-radius:var(--r-s);
  font-size:13.5px; font-weight:510; letter-spacing:-.14px;
  min-height:36px; display:inline-flex; align-items:center; transition:background .15s, color .15s}
.nav a:hover{background:var(--panel2); color:var(--fg)}
.nav a.pill{background:var(--accent); color:#22262a}
.nav a.pill:hover{background:var(--accent2); color:#22262a}
.nav a.aktif{background:var(--panel2); color:var(--fg)}

/* ---------- kartu ---------- */
main{padding:36px 0 72px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-l);
  padding:26px 24px; margin-bottom:16px}
.card.tight{padding:18px}
.card.sempit{max-width:520px; margin-left:auto; margin-right:auto}

/* ---------- hero ---------- */
.hero{padding:26px 0 34px; text-align:center}
.eyebrow{display:inline-block; padding:4px 11px; margin-bottom:18px;
  border:1px solid rgba(164,216,255,.34); border-radius:999px;
  background:rgba(164,216,255,.10); color:#BFE4FF;
  font-size:11.5px; font-weight:510; letter-spacing:.2px}
.hero h1{font-size:44px; letter-spacing:-1.4px; line-height:1.05; margin:0 0 14px}
.hero .sub{max-width:560px; margin:0 auto 26px}
.hero-aksi{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.hero-aksi .btn{min-height:42px; padding:11px 20px; font-size:14px}

.fitur{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-top:16px}
.fitur-item{border:1px solid var(--line); border-radius:var(--r-m); background:var(--panel); padding:18px;
  transition:background .15s, border-color .15s}
.fitur-item:hover{background:var(--panel2); border-color:rgba(164,216,255,.20)}
.fitur-item b{display:block; font-size:14px; font-weight:590; letter-spacing:-.2px; color:var(--fg); margin-bottom:5px}
.fitur-item span{display:block; font-size:13px; letter-spacing:-.13px; color:var(--muted)}

h1{font-size:30px; font-weight:510; letter-spacing:-.9px; line-height:1.15; margin:0 0 8px; color:var(--fg)}
h2{font-size:19px; font-weight:590; letter-spacing:-.32px; margin:28px 0 10px; color:var(--fg)}
h3{font-size:16px; font-weight:590; letter-spacing:-.2px; margin:20px 0 6px; color:var(--fg)}
h4{font-size:14.5px; font-weight:590; letter-spacing:-.16px; margin:18px 0 6px; color:var(--fg)}
.sub{color:var(--muted); font-size:15px; letter-spacing:-.16px; margin:0 0 20px}
.muted{color:var(--muted)}
.small{font-size:13px; letter-spacing:-.13px}
p{margin:0 0 12px}

/* ---------- tombol ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:38px; padding:9px 16px; border-radius:var(--r-s);
  border:1px solid transparent; background:var(--accent); color:#22262a;
  font-family:inherit; font-size:13.5px; font-weight:510; letter-spacing:-.14px;
  cursor:pointer; transition:background .15s, border-color .15s, color .15s, transform .06s}
.btn:hover{background:var(--accent2); color:#22262a}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none; box-shadow:var(--ring)}
.btn.ghost{background:var(--panel2); border-color:var(--line); color:var(--fg)}
.btn.ghost:hover{background:var(--panel3); border-color:rgba(164,216,255,.24); color:var(--fg)}
.btn.ok{background:transparent; border-color:rgba(16,185,129,.4); color:#7fd8b5}
.btn.ok:hover{background:rgba(16,185,129,.12); color:#9be5c8}
.btn.danger{background:transparent; border-color:rgba(242,85,90,.4); color:#ff9b9e}
.btn.danger:hover{background:rgba(242,85,90,.12); color:#ffbabd}
.btn.blok{width:100%}
.btn.kecil{min-height:32px; padding:6px 11px; font-size:12.5px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn-tele{background:var(--tele); color:#22262a; min-height:44px; font-size:14.5px; font-weight:590}
.btn-tele:hover{background:var(--accent2); color:#22262a}

/* ---------- form ---------- */
label{display:block; margin:16px 0 6px; font-size:13px; font-weight:510; letter-spacing:-.13px; color:var(--fg2)}
input,textarea,select{width:100%; padding:10px 13px; min-height:40px;
  font-family:inherit; font-size:14px; letter-spacing:-.14px;
  background:rgba(164,216,255,.04); color:var(--fg);
  border:1px solid var(--line); border-radius:var(--r-s);
  transition:border-color .15s, box-shadow .15s, background .15s}
input::placeholder,textarea::placeholder{color:var(--muted2)}
input:hover,textarea:hover,select:hover{border-color:rgba(164,216,255,.24)}
input:focus,textarea:focus,select:focus{outline:none; background:rgba(164,216,255,.06); box-shadow:var(--ring); border-color:transparent}
textarea{min-height:190px; resize:vertical; line-height:1.6}
textarea.pendek{min-height:120px}
.hint{color:var(--muted2); font-size:12.5px; letter-spacing:-.12px; margin-top:7px}
.kode-input{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:2.5px; text-transform:uppercase; font-size:17px; text-align:center; min-height:50px}
.row{display:flex; gap:12px; flex-wrap:wrap}
.row>*{flex:1 1 200px}
.row.rapat>*{flex:0 1 auto}

/* ---------- flash ---------- */
.flash{padding:12px 15px; border-radius:var(--r-m); margin-bottom:18px;
  border:1px solid; font-size:13.5px; letter-spacing:-.14px}
.flash.ok{background:rgba(16,185,129,.09); border-color:rgba(16,185,129,.28); color:#9be5c8}
.flash.err{background:rgba(242,85,90,.09); border-color:rgba(242,85,90,.28); color:#ffbabd}
.flash.info{background:rgba(164,216,255,.10); border-color:rgba(164,216,255,.30); color:#BFE4FF}

/* ---------- daftar bagian ---------- */
.bagian{display:flex; gap:16px; align-items:flex-start; padding:16px;
  border:1px solid var(--line-soft); border-radius:var(--r-m);
  background:rgba(164,216,255,.035); margin-bottom:10px;
  transition:background .15s, border-color .15s}
.bagian:hover{background:var(--panel2); border-color:var(--line)}
.bagian .no{flex:0 0 32px; height:32px; border-radius:var(--r-s);
  background:rgba(164,216,255,.14); border:1px solid rgba(164,216,255,.30); color:#BFE4FF;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:590; font-variant-numeric:tabular-nums}
.bagian .isi{flex:1 1 auto; min-width:0}
.bagian .isi h3{margin:0 0 3px; font-size:15px; font-weight:590; letter-spacing:-.2px}
.bagian .isi h3 a{color:var(--fg)}
.bagian .isi h3 a:hover{color:var(--accent3)}
.bagian .aksi{flex:0 0 auto; display:flex; flex-direction:column; gap:7px; align-items:flex-end}
.badge{display:inline-block; padding:2px 8px; border-radius:999px;
  font-size:11px; font-weight:510; letter-spacing:.1px; border:1px solid; vertical-align:middle}
.badge.baru{background:rgba(245,166,35,.12); color:#f8c15f; border-color:rgba(245,166,35,.3)}
.badge.selesai{background:rgba(16,185,129,.1); color:#5fd6a4; border-color:rgba(16,185,129,.28)}
.badge.mulai{background:rgba(164,216,255,.13); color:#BFE4FF; border-color:rgba(164,216,255,.34)}
.badge.belum{background:transparent; color:var(--muted2); border-color:var(--line)}
.badge.pakai{background:rgba(16,185,129,.1); color:#5fd6a4; border-color:rgba(16,185,129,.28)}
.badge.bebas{background:transparent; color:var(--muted); border-color:var(--line)}
.badge.cabut{background:rgba(242,85,90,.1); color:#ff9b9e; border-color:rgba(242,85,90,.28)}

/* ---------- progres ---------- */
.progres{margin:4px 0 0}
.progres-angka{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
.progres-angka b{font-size:32px; font-weight:510; letter-spacing:-1px; line-height:1;
  color:var(--fg); font-variant-numeric:tabular-nums}
.bar-luar{height:6px; background:rgba(164,216,255,.10); border-radius:999px; overflow:hidden}
.bar-dalam{height:100%; width:0; border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--accent3)); transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ---------- materi ---------- */
.materi{display:grid; grid-template-columns:212px 1fr; gap:36px; align-items:start}
.toc{position:sticky; top:80px; border-left:1px solid var(--line); padding:2px 0 2px 16px}
.toc a{display:block; color:var(--muted); font-size:13px; font-weight:510; letter-spacing:-.13px; padding:5px 0}
.toc a:hover{color:var(--fg)}
.toc a.l3{padding-left:12px; font-size:12.5px; font-weight:400}
.isi-materi{min-width:0; color:var(--fg2); font-size:15.5px; line-height:1.75}
.isi-materi h2{margin-top:36px}
.isi-materi img{max-width:100%; border-radius:var(--r-m); border:1px solid var(--line)}
.isi-materi pre{background:#2b2f32; border:1px solid var(--line); border-radius:var(--r-m);
  padding:15px 16px; overflow-x:auto; font-size:13px; line-height:1.65}
.isi-materi code{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  background:rgba(164,216,255,.10); border:1px solid var(--line-soft);
  border-radius:4px; padding:1.5px 5px; font-size:13px; color:#e6c9a8}
.isi-materi pre code{border:0; padding:0; background:none; color:var(--fg2)}
.isi-materi blockquote{margin:18px 0; padding:2px 0 2px 18px;
  border-left:2px solid var(--accent2); color:var(--muted)}
.isi-materi table{width:100%; border-collapse:collapse; margin:18px 0; font-size:14px}
.isi-materi th,.isi-materi td{border-bottom:1px solid var(--line); padding:10px 12px; text-align:left}
.isi-materi th{color:var(--muted); font-size:12px; font-weight:590; text-transform:uppercase; letter-spacing:.4px}
.isi-materi ul,.isi-materi ol{padding-left:22px}
.isi-materi li{margin:5px 0}
.isi-materi hr{border:0; border-top:1px solid var(--line); margin:32px 0}

/* ---------- tabel admin ---------- */
.tabel-scroll{overflow-x:auto}
table.data{width:100%; border-collapse:collapse; font-size:13.5px}
table.data th,table.data td{border-bottom:1px solid var(--line-soft); padding:11px 10px; text-align:left}
table.data th{color:var(--muted2); font-weight:590; font-size:11px;
  text-transform:uppercase; letter-spacing:.5px; white-space:nowrap}
table.data tr:hover td{background:var(--panel2)}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace; font-size:13px; letter-spacing:-.2px}
.stat{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px; margin-bottom:22px}
.stat .box{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-m); padding:16px 18px;
  transition:background .15s, border-color .15s}
.stat .box:hover{background:var(--panel2); border-color:rgba(164,216,255,.20)}
.stat .box b{display:block; font-size:26px; font-weight:510; letter-spacing:-.7px;
  color:var(--fg); line-height:1.2; font-variant-numeric:tabular-nums}
.stat .box span{color:var(--muted2); font-size:12px; font-weight:510; letter-spacing:-.12px}
.subnav{display:flex; gap:2px; flex-wrap:wrap; margin-bottom:18px; border-bottom:1px solid var(--line-soft); padding-bottom:10px}
.subnav a{color:var(--muted); font-size:13px; font-weight:510; padding:7px 11px; border-radius:var(--r-s)}
.subnav a:hover{background:var(--panel2); color:var(--fg)}
.subnav a.aktif{background:var(--panel2); color:var(--fg)}
.kode-list{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace; font-size:13px;
  background:#2b2f32; border:1px solid var(--line); border-radius:var(--r-m); padding:14px 15px;
  max-height:220px; overflow:auto; line-height:1.9; white-space:pre-wrap; word-break:break-all}

/* ---------- toast ---------- */
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px);
  background:rgba(12,13,15,.96); border:1px solid var(--line); color:var(--fg);
  padding:10px 16px; border-radius:999px; font-size:13px; font-weight:510;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60}
#toast.tampil{opacity:1; transform:translateX(-50%) translateY(0)}

/* ---------- footer ---------- */
.footer{border-top:1px solid var(--line-soft); color:var(--muted2);
  font-size:12.5px; letter-spacing:-.13px; padding:22px 0 40px}
.footer .sep{margin:0 8px; opacity:.5}

/* ---------- responsif ---------- */
@media (max-width:860px){
  .materi{grid-template-columns:1fr; gap:22px}
  .toc{position:static; border-left:0; border-bottom:1px solid var(--line); padding:0 0 12px}
}
@media (max-width:560px){
  body{font-size:14.5px}
  main{padding:24px 0 56px}
  .card{padding:20px 17px}
  h1{font-size:24px; letter-spacing:-.6px}
  .hero h1{font-size:31px; letter-spacing:-.9px}
  .bagian{flex-wrap:wrap}
  .bagian .aksi{width:100%; flex-direction:row; justify-content:flex-start}
  .bar{min-height:54px}
}

/* ---------- tombol WhatsApp apung ---------- */
/* Hijau resmi WhatsApp: tombol ini harus langsung dikenali, jadi warnanya
   sengaja tidak diikutkan ke palet biru langit. */
.wa-apung{
  position:fixed; right:20px; bottom:20px; z-index:60;
  width:54px; height:54px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  background:#25D366; color:#0b1f14;
  box-shadow:0 4px 14px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.2);
  transition:transform .14s, background .14s}
.wa-apung:hover{background:#2ee878; color:#0b1f14; transform:translateY(-2px)}
.wa-apung:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(37,211,102,.45)}
.wa-apung svg{display:block}
.btn-wa{background:#25D366; color:#0b1f14; min-height:44px; font-size:14.5px; font-weight:590}
.btn-wa:hover{background:#2ee878; color:#0b1f14}
@media (max-width:620px){
  .wa-apung{right:14px; bottom:14px; width:50px; height:50px}
  .wa-apung svg{width:23px; height:23px}
}

/* ---------- gambar dalam materi ---------- */
/* Gambar ikut lebar kolom, tinggi mengikuti rasio aslinya supaya tidak
   pernah gepeng. Latar gelap di belakang PNG transparan (tangkapan layar)
   supaya tidak jadi kotak putih. */
.isi-materi figure.gambar{ margin:22px 0 }
.isi-materi figure.gambar img{ display:block; width:100%; height:auto; background:var(--bg-soft) }
.isi-materi figure.gambar figcaption{ margin-top:8px; text-align:left; line-height:1.5 }
.isi-materi p > img{ vertical-align:middle; max-height:1.6em; width:auto; border:0; border-radius:4px }

/* ---------- video tersemat ---------- */
/* Bingkai responsif tanpa library: padding-top menahan rasio 16:9,
   iframe diisikan penuh ke dalamnya. Jalan juga di browser lama. */
.video-embed{
  position:relative; width:100%; margin:22px 0 6px;
  padding-top:56.25%;
  background:#000; border-radius:12px; overflow:hidden;
  border:1px solid var(--line);
}
/* Shorts itu video tegak; dibatasi lebarnya supaya tidak jadi kolom
   raksasa di layar lebar. */
.video-embed.tegak{ padding-top:0; aspect-ratio:9/16; max-width:340px; height:auto }
.video-embed iframe{ position:absolute; inset:0; width:100%; height:100%; border:0 }
.video-cap{ margin:0 0 20px }

/* ---------- cetak ---------- */
@media print{
  .topbar,.footer,.nav,.btn,.toc,.skip,.flash,.subnav,#toast,.wa-apung,.video-embed{display:none !important}
  body{background:#fff; color:#000; background-image:none; font-size:11pt}
  .card{border:0; padding:0; background:none; margin:0}
  h1,h2,h3,h4{color:#000}
  a{color:#000; text-decoration:underline}
  .isi-materi{color:#000}
  .isi-materi pre,.isi-materi code{background:#f4f4f4; border:1px solid #ccc; color:#000}
  /* Gambar tetap ikut tercetak — di materi teknis tangkapan layar itu inti
     isinya; hanya dijaga supaya tidak terbelah antar halaman. */
  .isi-materi figure.gambar{page-break-inside:avoid; break-inside:avoid}
  .isi-materi figure.gambar img{border:1px solid #ccc; background:none}
  .isi-materi figure.gambar figcaption{color:#444}
  .wrap{max-width:none; padding:0}
}
</style>
</head>
<body>
<a class="skip" href="#konten">Lompat ke konten</a>

<header class="topbar">
  <div class="wrap bar">
    <a class="brand" id="brand" href="#/">
      <strong>Karyawan Digital</strong>
      <span class="tag">Member area kelas Hermes Agent</span>
    </a>
    <nav class="nav" id="nav"></nav>
  </div>
</header>

<main id="konten" class="wrap">
  <div id="flash-slot"></div>
  <div id="view"></div>
</main>

<footer class="footer">
  <div class="wrap">
    Karyawan Digital — kelas Hermes Agent
    <span class="sep">·</span><a href="#/faq">Bantuan</a>
    <span class="sep">·</span><a href="#" id="footer-wa" hidden target="_blank" rel="noopener">Chat WhatsApp</a>
    <span class="sep">·</span><span id="mode-info">mode HTML · data tersimpan di browser ini</span>
  </div>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== 20-core.js ===== */
/* ============================================================
   Karyawan Digital — mode HTML (satu berkas, tanpa server)
   Data disimpan di localStorage browser ini. Tidak ada backend,
   jadi mode ini untuk demo/offline/1 perangkat. Versi PHP+MySQL
   dipakai kalau kode akses harus benar-benar terkunci di server.
   ============================================================ */
(function () {
'use strict';

var LS_KEY = 'KD_HTML_V1';
var APP_NAME = 'Karyawan Digital';
var COURSE_NAME = 'Hermes Agent';

/* ---------- util ---------- */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function now() { return window.__appNow ? new Date(window.__appNow).getTime() : Date.now(); }
function tgl(ts) {
  if (!ts) return '—';
  var d = new Date(ts);
  var bl = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return d.getDate() + ' ' + bl[d.getMonth()] + ' ' + d.getFullYear();
}
function tglJam(ts) {
  if (!ts) return '—';

/* ============================================================
   State + penyimpanan (localStorage). Semua mutasi lewat sini.
   ============================================================ */
(function () {
'use strict';
var K = window.KD;

var state = null;

function kosong() {
  return {
    versi: 1,
    users: [],        /* {id,nama,email,pass,role,kode,dibuat} */
    kode: [],         /* {kode,batch,note,dibuat,dipakaiOleh,dipakaiPada,dicabut} */
    bagian: [],       /* {urutan,judul,ringkas,isi_md,updated} */
    faq_md: '',
    setelan: {},
    progres: {},      /* uid -> {bagian: 'belum'|'mulai'|'selesai'} */
    catatan: {},      /* uid -> {bagian: teks} */
    kunjungan: {},    /* uid -> {bagian: ts} */
    tiket: [],        /* {id,uid,nama,email,isi,dibuat,dibalas} */
    rate: {},         /* bucket -> {hits,started} */
    audit: [],        /* {ev,uid,detail,ts} */
    sesi: null,       /* uid yang login */
    reset: {}         /* token -> {uid,exp} */
  };
}

function seedIsi(s) {
  var seed = window.KD_SEED;
  s.bagian = seed.bagian.map(function (b) {
    return { urutan: b.urutan, judul: b.judul, ringkas: b.ringkas, isi_md: b.isi_md, updated: K.now() };
  });
  s.faq_md = seed.faq_md;
  s.setelan = {
    telegram_url: seed.setelan.telegram_url,
    admin_kontak: seed.setelan.admin_kontak,
    wa_nomor: seed.setelan.wa_nomor || '',
    wa_pesan: seed.setelan.wa_pesan || '',
    links: seed.setelan.links.slice()
  };
  return s;
}

function normalisasi(s) {
  var d = kosong();
  Object.keys(d).forEach(function (k) {
    if (s[k] === undefined || s[k] === null) s[k] = d[k];
  });
  if (!Array.isArray(s.bagian) || !s.bagian.length) seedIsi(s);
  if (!s.setelan || typeof s.setelan !== 'object') s.setelan = {};
  if (!Array.isArray(s.setelan.links)) s.setelan.links = [];
  ['progres', 'catatan', 'kunjungan', 'rate', 'reset'].forEach(function (k) {
    if (typeof s[k] !== 'object' || Array.isArray(s[k]) || !s[k]) s[k] = {};
  });
  ['users', 'kode', 'tiket', 'audit'].forEach(function (k) {
    if (!Array.isArray(s[k])) s[k] = [];
  });
  return s;
}

function muat() {
  var raw = null;
  try { raw = window.localStorage.getItem(K.LS_KEY); } catch (e) { raw = null; }
  if (!raw) return seedIsi(kosong());
  try { return normalisasi(JSON.parse(raw)); }
  catch (e) { return seedIsi(kosong()); }   /* data rusak: jangan bikin app mati */
}

function simpan() {
  try { window.localStorage.setItem(K.LS_KEY, JSON.stringify(state)); }
  catch (e) { /* kuota penuh / mode privat: app tetap jalan untuk sesi ini */ }
}

/* ---------- audit ---------- */
function audit(ev, uid, detail) {
  state.audit.push({ ev: ev, uid: uid || null, detail: String(detail || '').slice(0, 300), ts: K.now() });
  if (state.audit.length > 400) state.audit = state.audit.slice(-400);
}

/* ---------- rate limit ---------- */
function rateOk(bucket, max, windowSec) {
  var r = state.rate[bucket];
  var t = Math.floor(K.now() / 1000);
  if (!r || (t - r.started) > windowSec) {
    state.rate[bucket] = { hits: 1, started: t };
    simpan();
    return true;
  }
  r.hits++;
  simpan();
  return r.hits <= max;
}
function rateReset(bucket) { delete state.rate[bucket]; simpan(); }

/* ---------- user ---------- */
function userAktif() {
  if (!state.sesi) return null;
  var u = cariUserId(state.sesi);
  if (!u) { state.sesi = null; simpan(); return null; }
  return u;
}
function cariUserId(id) {
  for (var i = 0; i < state.users.length; i++) if (state.users[i].id === id) return state.users[i];
  return null;
}
function cariUserEmail(email) {
  var e = String(email || '').trim().toLowerCase();
  for (var i = 0; i < state.users.length; i++) if (state.users[i].email === e) return state.users[i];
  return null;
}
function login(email, pw) {
  var bucket = 'login:' + String(email || '').toLowerCase();
  if (!rateOk(bucket, 8, 900)) return { ok: false, err: 'Terlalu banyak percobaan. Coba lagi sekitar 15 menit, atau pakai Lupa password.' };
  var u = cariUserEmail(email);
  if (!u || !K.pwCocok(pw, u.pass)) {
    audit('login_gagal', null, String(email || ''));
    simpan();
    return { ok: false, err: 'Email atau password salah.' };
  }
  state.sesi = u.id;
  rateReset(bucket);
  audit('login', u.id, '');
  simpan();
  return { ok: true, user: u };
}
function logout() {
  var u = state.sesi;
  state.sesi = null;
  audit('logout', u, '');
  simpan();
}

/* ---------- kode akses ---------- */
function cariKode(kode) {
  for (var i = 0; i < state.kode.length; i++) if (state.kode[i].kode === kode) return state.kode[i];
  return null;
}
function statusKode(kode) {
  var r = cariKode(kode);
  if (!r) return 'tidak_ada';
  if (r.dicabut) return 'dicabut';
  if (r.dipakaiOleh) return 'sudah_dipakai';
  return 'ok';
}
function buatKode(jumlah, batch, note) {
  jumlah = Math.max(1, Math.min(500, parseInt(jumlah, 10) || 1));
  var hasil = [];
  for (var i = 0; i < jumlah; i++) {
    var k, coba = 0;
    do { k = K.kodeGenerate(); coba++; } while (cariKode(k) && coba < 8);
    if (cariKode(k)) continue;
    state.kode.push({ kode: k, batch: String(batch || ''), note: String(note || ''),
      dibuat: K.now(), dipakaiOleh: null, dipakaiPada: null, dicabut: false });
    hasil.push(k);
  }
  audit('kode_buat', state.sesi, hasil.length + ' kode');
  simpan();
  return hasil;
}
function cabutKode(kode, nilai) {
  var r = cariKode(kode);
  if (!r || r.dipakaiOleh) return false;
  r.dicabut = !!nilai;
  audit(nilai ? 'kode_cabut' : 'kode_aktif', state.sesi, kode);
  simpan();
  return true;
}

/* ---------- redeem: kode valid → akun baru → langsung login ---------- */
function redeem(kodeRaw, nama, email, pw, pw2) {
  var norm = K.kodeNormalize(kodeRaw);
  if (!norm) return { ok: false, err: 'Format kode tidak sesuai. Contoh: HRMS-A2B3-C4D5-E6F7' };
  var st = statusKode(norm);
  if (st === 'tidak_ada') return { ok: false, err: 'Kode tidak ditemukan. Periksa lagi ketikannya.' };
  if (st === 'dicabut') return { ok: false, err: 'Kode ini sudah tidak berlaku. Hubungi admin.' };
  if (st === 'sudah_dipakai') return { ok: false, err: 'Kode ini sudah dipakai untuk membuat akun.', keLogin: true };

  nama = String(nama || '').trim();
  email = String(email || '').trim().toLowerCase();
  if (!nama || nama.length > 120) return { ok: false, err: 'Nama wajib diisi (maksimal 120 karakter).' };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return { ok: false, err: 'Email tidak valid.' };
  if (String(pw || '').length < 8) return { ok: false, err: 'Password minimal 8 karakter.' };
  if (pw !== pw2) return { ok: false, err: 'Dua kolom password belum sama.' };
  if (cariUserEmail(email)) return { ok: false, err: 'Email itu sudah terdaftar. Silakan masuk atau pakai email lain.', keLogin: true };

  var row = cariKode(norm);
  if (row.dipakaiOleh) return { ok: false, err: 'Kode baru saja dipakai.', keLogin: true };

  var u = { id: K.uid(), nama: nama, email: email, pass: K.pwBuat(pw),
    role: 'member', kode: norm, dibuat: K.now() };
  state.users.push(u);
  row.dipakaiOleh = u.id;
  row.dipakaiPada = K.now();
  state.sesi = u.id;
  audit('redeem_sukses', u.id, norm);
  simpan();
  return { ok: true, user: u };
}

/* Muat sekali saat berkas ini dievaluasi, supaya tidak ada jendela waktu
   di mana state masih null (mis. pengujian yang merender sebelum
   DOMContentLoaded). mulai() memuatnya ulang, dan itu tidak berbahaya. */
state = muat();

window.KD_STORE_1 = {
  kosong: kosong, seedIsi: seedIsi, normalisasi: normalisasi, muat: muat, simpan: simpan,
  audit: audit, rateOk: rateOk, rateReset: rateReset,
  userAktif: userAktif, cariUserId: cariUserId, cariUserEmail: cariUserEmail,
  login: login, logout: logout,
  cariKode: cariKode, statusKode: statusKode, buatKode: buatKode, cabutKode: cabutKode,
  redeem: redeem,
  _set: function (s) { state = s; },
  /* Muat malas: kalau ada yang memakai state sebelum mulai() jalan
     (mis. harness pengujian), jangan biarkan null. */
  _get: function () { if (!state) state = muat(); return state; }
};
})();

function materiBaru(bagian, uid) {

function cariMateri(q) {

var flashQueue = [];
var routes = {};
var hashTerakhir = null;

function flash(type, msg) { flashQueue.push({ type: type, msg: msg }); }
function flashRender() {
  var slot = document.getElementById('flash-slot');
  if (!slot) return;
  slot.innerHTML = flashQueue.map(function (f) {
    return '<div class="flash ' + f.type + '">' + f.msg + '</div>';
  }).join('');
  flashQueue = [];
}
function toast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('tampil');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('tampil'); }, 1900);
}

function go(hash) {
  if (('#' + hash.replace(/^#/, '')) === window.location.hash) render();
  else window.location.hash = hash.replace(/^#/, '');
}

function parseHash() {
  var h = (window.location.hash || '#/').replace(/^#\/?/, '');
  var q = '';
  var qi = h.indexOf('?');
  if (qi >= 0) { q = h.slice(qi + 1); h = h.slice(0, qi); }
  var seg = h.split('/').filter(function (x) { return x !== ''; });
  var query = {};
  q.split('&').forEach(function (kv) {
    if (!kv) return;
    var p = kv.split('=');
    query[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
  });
  return { nama: seg[0] || 'beranda', arg: seg[1] || '', query: query };
}

function navRender(rute) {
  var u = S.userAktif();
  var nav = document.getElementById('nav');
  var brand = document.getElementById('brand');
  if (brand) brand.setAttribute('href', u ? '#/dashboard' : '#/');
  if (!nav) return;
  var item = [];
  function a(href, label, cls) {
    var aktif = ('#/' + rute.nama) === href ? ' aktif' : '';
    item.push('<a class="' + (cls || '') + aktif + '" href="' + href + '">' + label + '</a>');
  }
  if (u) {
    a('#/dashboard', 'Dashboard');
    a('#/cari', 'Cari');
    a('#/faq', 'FAQ');
    a('#/profil', 'Profil');
    if (u.role === 'admin') a('#/admin', 'Admin', 'pill');
    item.push('<a href="#/keluar">Keluar</a>');
  } else {
    a('#/redeem', 'Redeem kode');
    a('#/masuk', 'Masuk');
  }
  nav.innerHTML = item.join('');
}

function render() {
  var rute = parseHash();
  var view = document.getElementById('view');
  var fn = routes[rute.nama] || routes.beranda;
  hashTerakhir = window.location.hash || '#/';
  navRender(rute);
  var html = '';
  try { html = fn(rute) || ''; }
  catch (e) {
    html = '<div class="card"><h1>Terjadi kesalahan</h1><p class="sub">' + K.esc(e.message) + '</p></div>';
  }
  if (html === false) return;                 /* view sudah redirect sendiri */
  view.innerHTML = html;
  flashRender();
  waApungRender();
  window.scrollTo(0, 0);
  pasangHandler(view);
  document.title = (routes._judul || K.APP_NAME) + ' — ' + K.APP_NAME;
}

/* Tautan WA di footer ikut nomor yang sama; disembunyikan kalau nomor kosong. */
function waFooterRender(url) {
  var f = document.getElementById('footer-wa');
  if (!f) return;
  var sep = f.previousElementSibling;
  if (url) { f.href = url; f.hidden = false; if (sep) sep.hidden = false; }
  else { f.hidden = true; if (sep) sep.hidden = true; }
}

/* Semua interaksi dipasang di sini supaya tidak ada inline onclick. */
function pasangHandler(root) {
  root.querySelectorAll('[data-aksi]').forEach(function (el) {
    var ev = el.tagName === 'FORM' ? 'submit' : (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' ? 'input' : 'click');
    el.addEventListener(ev, function (e) {
      if (ev !== 'input') e.preventDefault();
      var fn = window.KD_AKSI[el.getAttribute('data-aksi')];
      if (fn) fn(el, e);
    });
  });
  var bar = root.querySelector('.bar-dalam');
  if (bar) setTimeout(function () { bar.style.width = (bar.getAttribute('data-persen') || 0) + '%'; }, 40);
  var fokus = root.querySelector('[data-fokus]');
  if (fokus && fokus.focus) { try { fokus.focus(); } catch (e) {} }
}

function badgeStatus(s) {
  if (s === 'selesai') return '<span class="badge selesai">Selesai</span>';
  if (s === 'mulai') return '<span class="badge mulai">Sedang dipelajari</span>';

}
function unduh(namaFile, isi, mime) {
  try {
    var blob = new Blob([isi], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = namaFile;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 300);
    return true;
  } catch (e) { return false; }
}

A['redeem-cek'] = function (form) {
  // Batas 15 percobaan / 15 menit — cukup longgar untuk salah ketik.
  if (!S.rateOk('redeem', 15, 900)) {
    redeemState.err = 'Terlalu banyak percobaan. Coba lagi sekitar 15 menit, atau hubungi admin lewat <a href="#/tanya">Tanya Admin</a>.';
    U.render(); return;
  }
  var norm = K.kodeNormalize(U.nilai(form, 'kode'));
  if (!norm) {
    redeemState.err = 'Format kode tidak sesuai. Contoh: ' + K.KODE_PREFIX + '-A2B3-C4D5-E6F7';
    S.audit('redeem_gagal', null, 'format');
    S.simpan(); U.render(); return;
  }
  var st = S.statusKode(norm);
  if (st === 'ok') {
    redeemState.tahap = 'akun';
    redeemState.kode = norm;
    // Kode benar: bebaskan hitungan supaya salah ketik sebelumnya tidak
    // menghalangi pendaftaran.
    S.rateReset('redeem');
    U.render(); return;
  }
  redeemState.err =
    st === 'sudah_dipakai' ? 'Kode ini sudah dipakai untuk membuat akun. Silakan <a href="#/masuk">masuk</a>.' :
    st === 'dicabut' ? 'Kode ini sudah tidak berlaku. Hubungi admin.' :
    'Kode tidak ditemukan. Periksa lagi ketikannya.';
  S.audit('redeem_gagal', null, norm);
  S.simpan();
  U.render();
};

var kodeFilter = { q: '', status: 'semua' };

R['admin-kode'] = function () {
  var g = jaga();
  if (g.pergi) return false;
  if (g.tolak) return g.tolak;
  var st = S._get();

  var h = subnav('admin-kode') +
  '<div class="card"><h1>Kode akses</h1>' +

      '<div><label for="batch">Batch (opsional)</label>' +
        '<input id="batch" name="batch" maxlength="60" placeholder="misal: lynk-okt"></div>' +
      '<div><label for="note">Catatan (opsional)</label>' +
        '<input id="note" name="note" maxlength="120" placeholder="misal: order #1234"></div>' +
    '</div><p style="margin-top:16px"><button class="btn" type="submit">Generate Kode Baru</button></p></form>';

  if (kodeBaru.length) {
    h += '<h3>' + kodeBaru.length + ' kode baru</h3>' +
      '<div class="kode-list" id="kode-baru">' + K.esc(kodeBaru.join('\n')) + '</div>' +
      '<div class="row rapat" style="margin-top:12px">' +
        '<button class="btn ghost kecil" data-aksi="kode-copy">Copy semua</button>' +
        '<button class="btn ghost kecil" data-aksi="kode-csv">Unduh CSV semua kode</button>' +
      '</div>';
  }
  h += '</div>';

  /* filter + daftar */
  var rows = st.kode.slice().sort(function (a, b) { return b.dibuat - a.dibuat; });
  var q = kodeFilter.q.trim().toUpperCase();
  if (q) rows = rows.filter(function (k) {
    var u = k.dipakaiOleh ? S.cariUserId(k.dipakaiOleh) : null;
    return (k.kode + ' ' + (k.batch || '') + ' ' + (k.note || '') + ' ' +
      (u ? u.email + ' ' + u.nama : '')).toUpperCase().indexOf(q) >= 0;

  if (!nama) return { ok: false, err: 'Nama wajib diisi.' };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return { ok: false, err: 'Email tidak valid.' };
  if (String(pw || '').length < 8) return { ok: false, err: 'Password minimal 8 karakter.' };
  if (pw !== pw2) return { ok: false, err: 'Dua kolom password belum sama.' };
  if (S.cariUserEmail(email)) return { ok: false, err: 'Email itu sudah terdaftar.' };
  // Nomor WA opsional, tapi kalau diisi harus benar — daripada dipasang
  // setengah jalan lalu tombolnya tidak bisa dibuka pembeli.
  var waIsi = String(wa || '').trim();
  var waBersih = waIsi === '' ? '' : K.waNormal(waIsi);
  if (waIsi !== '' && waBersih === '') {
    return { ok: false, err: 'Nomor WhatsApp tidak masuk akal. Contoh: 081234567890.' };
  }

  var u = { id: K.uid(), nama: nama, email: email, pass: K.pwBuat(pw),
    role: 'admin', kode: null, dibuat: K.now() };
  S._get().users.push(u);
  var setelanBaru = {};
  if (/^https?:\/\//i.test(String(telegram || '').trim())) setelanBaru.telegram_url = String(telegram).trim();
  if (waBersih) setelanBaru.wa_nomor = waBersih;
  if (Object.keys(setelanBaru).length) S2.setelanSimpan(setelanBaru);
  S._get().sesi = u.id;
  S.audit('setup_admin', u.id, email);
  S.simpan();
  return { ok: true, user: u };
}

A.setup = function (form) {
  var r = buatAdmin(U.nilai(form, 'nama'), U.nilai(form, 'email'),
    U.nilai(form, 'password'), U.nilai(form, 'password2'),
    U.nilai(form, 'telegram'), U.nilai(form, 'wa'));
  if (!r.ok) { setupErr = r.err; U.render(); return; }
  U.flash('ok', 'Pemasangan selesai. Mulai dari Kode akses untuk membuat kode pembeli.');
  U.go('/admin');
};

/* ---------- inisialisasi ---------- */
var sudahMulai = false;
function mulai() {
  if (sudahMulai) { U.render(); return; }
  sudahMulai = true;
  S._set(S.muat());

  /* Belum ada admin sama sekali → arahkan ke pemasangan. */
  if (!adaAdmin()) {
    var r = U.parseHash();
    if (r.nama !== 'setup') { window.location.hash = '#/setup'; }
  }

  window.addEventListener('hashchange', U.render);
  U.render();
}

/* ---------- demo cepat: admin + member + kode contoh ---------- */
function demoSeed() {
  var st = S._get();
  st.users = [];
  st.kode = [];
  st.progres = {}; st.catatan = {}; st.kunjungan = {}; st.tiket = []; st.rate = {}; st.reset = {};
  st.sesi = null;

  var admin = { id: K.uid(), nama: 'Darwin', email: 'admin@demo.id', pass: K.pwBuat('demo12345'),
    role: 'admin', kode: null, dibuat: K.now() - 86400000 * 9 };
  st.users.push(admin);

  var kode = S.buatKode(4, 'demo', 'contoh order');
  var member = { id: K.uid(), nama: 'Budi', email: 'budi@demo.id', pass: K.pwBuat('demo12345'),
    role: 'member', kode: kode[0], dibuat: K.now() - 86400000 * 2 };
  st.users.push(member);
  var k0 = S.cariKode(kode[0]);
  k0.dipakaiOleh = member.id;
  k0.dipakaiPada = K.now() - 86400000 * 2;

  S2.progresSet(member.id, 1, 'selesai');
  S2.progresSet(member.id, 2, 'mulai');
  S2.catatanSimpan(member.id, 1, 'Provider sempat salah nama, sudah dibetulkan.');
  S2.tiketKirim(member.id, 'Di Bagian 3, cron saya jalan tapi hasilnya kosong. Kira-kira salah di mana ya?');
  S.simpan();
  return { admin: admin.email, member: member.email, password: 'demo12345', kode: kode.slice(1) };
}

/* Hook pengujian: dipakai .test/smoke.js, bukan bagian dari UI. */
window.__app = {
  K: K, store: S, store2: S2, ui: U, aksi: A,
  state: function () { return S._get(); },
  render: U.render, go: U.go, mulai: mulai,
  muatUlang: function () { S._set(S.muat()); U.render(); },
  reset: function (denganSeed) {
    var s = S.kosong();
    if (denganSeed !== false) S.seedIsi(s);
    S._set(s);
    S.simpan();
    return s;
  },
  buatAdmin: buatAdmin, adaAdmin: adaAdmin, demoSeed: demoSeed
};

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mulai);
  else mulai();
}
})();
